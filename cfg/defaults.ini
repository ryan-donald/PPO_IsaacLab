# Shared defaults for all tasks. Each task's .ini only needs to set the values
# that differ from these; task files are read after this one and override it.
[train]
num_steps_per_env = 24
num_mini_batches = 4
num_learning_epochs = 5
value_coef = 1.0
gae_lambda = 0.95
schedule_type = adaptive
max_grad_norm = 1.0
use_normalization = True

[policy]
hidden_dims = 256,128,64
