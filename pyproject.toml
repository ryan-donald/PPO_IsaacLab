[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"


[project]
name = "ryan-ppo"
version = "1.0.0"
authors = [
  { name="Ryan Donald" }
]
requires-python = ">=3.12"
dependencies = [
  "torch >= 2.7.0",
  "numpy >= 1.26.4",
  "pytest",
  "rich",
  "wandb",
  "gymnasium",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["ryan_ppo", "ryan_tasks"]
known-third-party = ["wandb", "gymnasium", "isaaclab_tasks", "torch", "numpy"]